name: azkar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  json_annotation: ^4.9.0
  retrofit: ^4.7.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/al-quran.png"

flutter_native_splash:
  color: "#040C23"
  image: assets/al-quran.png
  android: true
  ios: true
  android_12:
    color: "#040C23"
    # image: assets/al-quran.png

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
    - assets/datas/
    - assets/al-quran.png
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
